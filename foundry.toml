[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"

# Fork tests fail at *runtime* in setUp() for want of a mainnet RPC, not at
# compile time -- which is why this is `no_match_path` (a single glob that
# filters test *selection* and leaves the files compiling) rather than `skip`
# (an array that excludes from *compilation*). Without it the bare `forge test`
# in groups 1, 2, 4 and 5 goes red for want of an RPC it does not need.
# WISH group 1 deliverable 1. Form used: project-relative "test/fork/**".
no_match_path = "test/fork/**"

[profile.fork]
# SENTINEL OVERRIDE -- NOT AN OMISSION. Foundry profiles inherit from
# [profile.default] and TOML has no way to write "unset", so omitting this key
# would make the fork profile inherit "test/fork/**", exclude its own tests,
# match nothing, and still exit 0 -- passing green while running nothing.
# Do not "simplify" this away. test/fork/ProfileGuard.t.sol makes it falsifiable.
no_match_path = "test/__never__/**"
eth_rpc_url = "base"
fork_block_number = 50000000

[rpc_endpoints]
base = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

# Group 5's `forge script --verify` resolves its key from this table or from
# ETHERSCAN_API_KEY, never from a bare BASESCAN_API_KEY in the environment.
[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}", chain = 84532 }

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
